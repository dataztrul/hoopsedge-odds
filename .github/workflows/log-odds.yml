name: log-odds

# GitHub's schedule is unreliable (gaps of hours), so one run loops for ~5.5 h - a snapshot every
# 5 min when a game starts within 75 min, otherwise every 10-15 min - and then starts the next run
# itself. The hourly schedule is only a watchdog that restarts the chain if it breaks.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: log-odds
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      LOOP_MINUTES: "330"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Snapshot loop
        env:
          HOOPSEDGE_TOKEN: ${{ secrets.HOOPSEDGE_TOKEN }}
        run: |
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          end=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          while true; do
            git pull -q --rebase -X theirs || true
            python scripts/log_odds.py || echo "snapshot failed"
            git add data
            if ! git diff --cached --quiet; then
              git commit -q -m "odds $(date -u +%Y-%m-%dT%H:%MZ)"
              for i in 1 2 3 4; do git pull -q --rebase -X theirs && git push -q && break; sleep 7; done
            fi
            # GitHub runs the private model repo's hourly schedule only every ~6 h. If a token with
            # Actions access to that repo is stored as the secret HOOPSEDGE_TOKEN, start its model job
            # from here instead, at most once an hour.
            if [ -n "$HOOPSEDGE_TOKEN" ] && [ $(( $(date +%s) - ${last_model:-0} )) -ge 3600 ]; then
              GH_TOKEN="$HOOPSEDGE_TOKEN" gh workflow run snapshot.yml -R dataztrul/hoopsedge --ref main && last_model=$(date +%s) || echo "model dispatch failed"
            fi
            # ... and the nightly job too: GitHub skips its 04:40 schedule on some nights
            if [ -n "$HOOPSEDGE_TOKEN" ] && [ "$(date -u +%H)" -ge 5 ] && [ "${daily_checked:-}" != "$(date -u +%F)" ]; then
              last=$(GH_TOKEN="$HOOPSEDGE_TOKEN" gh api "repos/dataztrul/hoopsedge/actions/workflows/daily.yml/runs?per_page=1" --jq '.workflow_runs[0].created_at' 2>/dev/null || echo "")
              if [ "${last:0:10}" != "$(date -u +%F)" ]; then
                GH_TOKEN="$HOOPSEDGE_TOKEN" gh workflow run daily.yml -R dataztrul/hoopsedge --ref main && echo "nightly job dispatched"
              fi
              daily_checked=$(date -u +%F)
            fi
            wait=$(python scripts/next_wait.py)
            [ $(( $(date +%s) + wait )) -lt $end ] || break
            sleep "$wait"
          done
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run log-odds.yml --ref "${GITHUB_REF_NAME}"
